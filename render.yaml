databases:
  - name: outbox-db
    plan: free
    # Optional: specify a custom DB name, user, and region
    # databaseName: outbox
    # user: outbox_user
    # region: oregon

services:
  # Redis managed instance (free tier)
  - type: redis
    name: outbox-redis
    plan: free
    # Render provides REDIS_URL env var automatically

  # Elasticsearch private service (Docker, using official image)
  - type: pserv
    name: outbox-search
    runtime: docker
    plan: starter
    region: oregon
    repo: https://github.com/render-examples/elasticsearch
    # Disk for data persistence
    disk:
      name: es-data
      mountPath: /usr/share/elasticsearch/data
      sizeGB: 10
    envVars:
      - key: discovery.type
        value: single-node
      - key: ES_JAVA_OPTS
        value: "-Xms512m -Xmx512m"

  
  # 3️⃣ Backend API – Docker‑based web service
  - type: web
    name: outbox-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: apps/server/Dockerfile
    # Render injects a $PORT env var at runtime; you can keep the explicit value
    # if your code is hard‑coded to listen on 3000, otherwise remove the line.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-db
          property: connectionString
      # ✅ Redis URL – correctly reference the Redis service
      - key: REDIS_URL
        fromService: outbox-redis
        value: "${SERVICE_OUTBOX_REDIS_URL}"
      # ✅ Elasticsearch URL – correctly reference the Elasticsearch private service
      - key: ELASTICSEARCH_URL
        fromService: outbox-search
        value: "${SERVICE_OUTBOX_SEARCH_URL}"
      - key: SLACK_CLIENT_ID
        value: "<YOUR_SLACK_CLIENT_ID>"
      - key: SLACK_CLIENT_SECRET
        value: "<YOUR_SLACK_CLIENT_SECRET>"
      - key: JWT_SECRET
        value: "<YOUR_RANDOM_JWT_SECRET>"
      - key: MAILER_HOST
        value: "smtp.ethereal.email"
      - key: MAILER_PORT
        value: "587"
      - key: MAILER_USER
        value: "<ETHEREAL_USER>"
      - key: MAILER_PASS
        value: "<ETHEREAL_PASS>"

  # Front‑end – static site build
  - type: web
    name: outbox-web
    runtime: static
    plan: free
    buildCommand: "pnpm --filter web build"
    staticPublishPath: "apps/web/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://outbox-backend.onrender.com"