services:
  # PostgreSQL managed instance (Render provides a free tier)
  - type: postgresql
    name: outbox-db
    plan: free
    # Render will create DATABASE_URL env var automatically

  # Redis managed instance (free tier as well)
  - type: redis
    name: outbox-redis
    plan: free
    # Render provides REDIS_URL env var automatically

  # Elasticsearch managed instance (optional – Render offers a free tier on the "starter" plan)
  - type: elasticsearch
    name: outbox-search
    plan: free
    # Render provides ELASTICSEARCH_URL env var

  # Backend API – Docker service
  - type: docker
    name: outbox-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: apps/server/Dockerfile
    # Service will listen on port 3000 inside the container
    ports:
      - port: 3000
        protocol: http
    # Environment variables – replace placeholder values with your secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromService: outbox-db
        value: "${SERVICE_OUTBOX_DB_URL}"   # Render substitutes automatically
      - key: REDIS_URL
        fromService: outbox-redis
        value: "${SERVICE_OUTBOX_REDIS_URL}"
      - key: ELASTICSEARCH_URL
        fromService: outbox-search
        value: "${SERVICE_OUTBOX_SEARCH_URL}"
      - key: SLACK_CLIENT_ID
        value: "<YOUR_SLACK_CLIENT_ID>"
      - key: SLACK_CLIENT_SECRET
        value: "<YOUR_SLACK_CLIENT_SECRET>"
      - key: JWT_SECRET
        value: "<YOUR_RANDOM_JWT_SECRET>"
      - key: MAILER_HOST
        value: "smtp.ethereal.email"
      - key: MAILER_PORT
        value: "587"
      - key: MAILER_USER
        value: "<ETHEREAL_USER>"
      - key: MAILER_PASS
        value: "<ETHEREAL_PASS>"

  # Front‑end – static site build (Render's "Static Site" type)
  - type: static
    name: outbox-web
    plan: free
    buildCommand: "pnpm --filter web build"
    publishPath: "apps/web/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://outbox-backend.onrender.com"  # Render default domain for the backend service
