databases:
  - name: outbox-db
    plan: free
    # Optional: specify a custom DB name, user, and region
    # databaseName: outbox
    # user: outbox_user
    # region: oregon

services:
  # Redis managed instance (free tier)
  - type: redis
    name: outbox-redis
    plan: free
    ipAllowList: []
    # Render provides REDIS_URL env var automatically

  # Elasticsearch external service – use a free‑tier cloud provider
  # (no pserv here; add the endpoint as a secret in Render UI)
  # The backend will read ELASTICSEARCH_URL from its env vars.

  # Backend API – Docker‑based web service
  - type: web
    name: outbox-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: apps/server/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-db
          property: connectionString
      - key: REDIS_URL
        fromService: outbox-redis
        value: "${SERVICE_OUTBOX_REDIS_URL}"
      - key: ELASTICSEARCH_URL
        value: "${ELASTICSEARCH_URL}"  # set this secret in Render UI
      - key: SLACK_CLIENT_ID
        value: "<YOUR_SLACK_CLIENT_ID>"
      - key: SLACK_CLIENT_SECRET
        value: "<YOUR_SLACK_CLIENT_SECRET>"
      - key: JWT_SECRET
        value: "<YOUR_RANDOM_JWT_SECRET>"
      - key: MAILER_HOST
        value: "smtp.ethereal.email"
      - key: MAILER_PORT
        value: "587"
      - key: MAILER_USER
        value: "<ETHEREAL_USER>"
      - key: MAILER_PASS
        value: "<ETHEREAL_PASS>"

  # Front‑end – static site build
  - type: static
    name: outbox-web
    runtime: static
    plan: free
    buildCommand: "pnpm --filter web build"
    staticPublishPath: "apps/web/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://outbox-backend.onrender.com"
